# An EvoAgent-NO task: everything needed to pretrain a student on invented problems.
name: pde1d
description: >
  1D PDEs on a periodic interval, built from nine terms. The student sees four frames and
  predicts the next, without being told the PDE.

physics: evoagent_no.physics.pde1d    # the answer key: a module path, or ./file.py in this folder
heldout: evoagent_no.evals.pde1d      # test problems with references from other methods
generator: generator.py                # the question-maker; agents may rewrite its EVOLVE-BLOCK
context: context.md                    # what the agents are told about this physics

student:                               # 1D Fourier neural operator
  width: 64
  modes: 32
  layers: 4
  padding: 0                           # the domain is periodic
  lr: 1.0e-3
  schedule: cosine                     # cosine (warm-up, then decay to min_lr_ratio × lr) or constant
  warmup_steps: 100
  min_lr_ratio: 0.05
  ema: 0.999                           # averaged student for tests and the saved model; 0 = off

training:
  rounds: 200
  problems_per_round: 256
  steps_per_round: 20                  # student training steps per round
  batch: 256
  eval_every: 10
  eval_count: 64                       # held-out instances per family

selfplay:                              # optional: pick each round's problems by self-play
  enabled: false                       # true, or `evoagent-no run --selfplay`
  pool: {fresh: 0.4, mutated: 0.4, replay: 0.2}
  score: relative                      # relative (default) or paper; see evoagent_no.score
  too_hard: 4.0                        # loss > this × median of fresh problems: out of reach; null = off

agents:                                # the slow loop: LLMs evolve generator.py
  enabled: true                        # false, or `evoagent-no run --no-agents`: the baseline
  every: 20                            # rounds between checks: is an evolution step worth it?
  trigger: plateau                     # plateau: only when the student stops improving; every: always
  min_improvement: 0.05                # plateau = training loss improved less than this over `every` rounds
  candidates: 2                        # LLM calls per evolution step
  parallel: 2                          # LLM calls in flight at once
  probe_problems: 128                  # problems used to measure a generator on the student
  islands: 2                           # separate populations of generators
  migrate_every: 3                     # steps between islands swapping their best generator
  rescore: 8                           # elites re-measured on the current student each step
  inspirations: 2                      # other generators shown to the agent
  edits: diff                          # diff (SEARCH/REPLACE, full file allowed) or full
  llm:                                 # one model, or a list of them each with a `weight`
    backend: claude-cli                # uses the Claude Code CLI login (your subscription)
    model: claude-sonnet-5
    effort: medium                     # low | medium | high | xhigh | max; null: the model's default
    budget_usd: 1.0                    # cap per LLM call
